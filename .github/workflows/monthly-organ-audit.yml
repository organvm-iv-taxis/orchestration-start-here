name: Monthly Organ Audit

on:
  schedule:
    - cron: '0 2 1 * *'  # 1st of month, 2 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch canonical registry
        env:
          GH_TOKEN: ${{ secrets.CROSS_ORG_TOKEN || secrets.ORCHESTRATION_PAT || secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-registry.sh repo-registry.json

      - name: Run Organ Audit
        id: organ-audit
        continue-on-error: true
        run: |
          python3 scripts/organ-audit.py \
            --registry repo-registry.json \
            --governance governance-rules.json \
            --output audit-report.md

      - name: Calculate Metrics
        run: |
          python3 scripts/calculate-metrics.py \
            --registry repo-registry.json \
            --output metrics.json

      - name: Create GitHub Issue with Report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.md', 'utf8');
            const metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));
            const date = new Date().toISOString().split('T')[0];

            const metricsSection = [
              '',
              '## System Metrics',
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Total repos | ${metrics.total_repos} |`,
              `| On GitHub | ${metrics.repos_on_github} |`,
              `| Documented | ${metrics.documented_repos} |`,
              `| Flagships | ${metrics.flagship_repos} |`,
              `| Operational organs | ${metrics.operational_organs}/${metrics.total_organs} |`,
              `| Completion | ${metrics.completion}% |`,
              `| Dependencies | ${metrics.total_dependencies} |`,
            ].join('\n');

            const organTable = Object.entries(metrics.organs || {}).map(([id, o]) =>
              `| ${id} | ${o.name} | ${o.status} | ${o.on_github} | ${o.documented} | ${o.flagships} |`
            ).join('\n');

            const organSection = [
              '',
              '## Per-Organ Breakdown',
              '',
              '| Organ | Name | Status | On GH | Documented | Flagships |',
              '|-------|------|--------|-------|------------|-----------|',
              organTable,
            ].join('\n');

            const body = `# Monthly Organ Audit — ${date}\n\n${report}\n${metricsSection}\n${organSection}\n\n---\n*Generated from organvm/organvm-corpvs-testamentvm + repo-registry.json*`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Monthly Organ Audit — ${date}`,
              body: body,
              labels: ['audit', 'monthly']
            });

      - name: Enforce audit result
        if: always()
        run: |
          if [[ "${{ steps.organ-audit.outcome }}" != "success" ]]; then
            echo "::error::Organ audit reported critical findings"
            exit 1
          fi
